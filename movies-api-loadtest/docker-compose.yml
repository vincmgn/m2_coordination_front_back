name: movies

services:
  mongo:
    image: mongo:8.0
    container_name: movies-db
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: movies-api:${API_TAG:-dev}
    build: .
    container_name: movies-api
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: sample_mflix
      PORT: "3000"
      AB_ENABLED: "true"
      OTEL_SERVICE_NAME: movies-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_SAMPLER: parentbased_always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.version=${GIT_SHA:-local},deployment.environment.name=formation
      OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,undici,express,mongodb
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      TP_TICKETS: ${TP_TICKETS:-0}
      SMS_GATEWAY_URL: http://sms-passerelle:4000
      APP_SECRET: ${APP_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    ports:
      - "127.0.0.1:8080:3000"
    depends_on:
      mongo:
        condition: service_healthy
      collector:
        condition: service_started
      sms-passerelle:
        condition: service_started

  web:
    image: movies-web:dev
    build:
      context: ../movies-web
      args:
        GIT_SHA: ${GIT_SHA:-local}
    container_name: movies-web
    ports:
      - "127.0.0.1:8081:80"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
      collector:
        condition: service_started

  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: movies-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observabilite/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: movies-jaeger
    ports:
      - "127.0.0.1:16686:16686"

  sms-passerelle:
    image: node:22-alpine
    container_name: movies-sms
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./sms-passerelle/server.mjs:/srv/server.mjs:ro
    environment:
      SMS_DELAY_MS: "1200"

volumes:
  mongo-data:

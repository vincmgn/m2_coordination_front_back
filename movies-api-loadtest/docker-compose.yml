# Environnement « déployé » : l'API (image versionnée) et MongoDB (données dans un volume persistant).
# Changer de version de l'API ne recrée que le conteneur api : le volume mongo-data n'est jamais touché.
# ⚠️ Ne jamais lancer `docker compose down -v` : -v supprime le volume, donc les données.
name: movies

services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27018:27017" # 27018 pour ne pas gêner une MongoDB locale existante
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Version choisie par scripts/deploy.sh et scripts/rollback.sh.
    image: movies-api:${API_TAG:-dev}
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: sample_mflix
      PORT: "3000"
    ports:
      - "127.0.0.1:8080:3000" # 8080 pour ne pas gêner `npm run dev` (3000)
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:

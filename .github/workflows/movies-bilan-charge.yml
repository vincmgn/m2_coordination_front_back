name: "movies-api-loadtest : bilan de charge complet"

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base de données utilisée"
        type: choice
        options: [ci, atlas]
        default: ci
  schedule:
    - cron: "43 6 * * 1"
      timezone: "Europe/Paris"

permissions:
  contents: read

concurrency:
  group: movies-bilan-charge
  cancel-in-progress: false

jobs:
  bilan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: movies-api-loadtest

    env:
      USE_ATLAS: ${{ github.event_name == 'workflow_dispatch' && inputs.base == 'atlas' }}
      MONGODB_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.base == 'atlas' && secrets.MONGODB_URI || 'mongodb://localhost:27017' }}

    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movies-api-loadtest/package-lock.json

      - run: npm ci

      - name: Vérification des types et build
        run: |
          npm run typecheck
          npm run build

      - name: Vérification du secret Atlas
        if: env.USE_ATLAS == 'true'
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Secret MONGODB_URI absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Remplissage de la base jetable
        if: env.USE_ATLAS != 'true'
        run: npm run seed

      - name: Démarrage de l'API
        run: |
          npm start > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: "Simulation 1 : montée en charge progressive"
        id: progressif
        continue-on-error: true
        run: npm run -s load:report -- --quiet 2>&1 | tee k6-progressif.txt

      - name: "Simulation 2 : débit maximal par route (seuils anti-régression)"
        id: max
        continue-on-error: true
        run: npm run -s load:max -- --quiet 2>&1 | tee k6-max.txt

      - name: "Simulation 3 : test de rupture par route"
        id: rupture
        continue-on-error: true
        run: npm run -s load:breakpoint

      - name: "Simulation 4 : paliers d'utilisateurs virtuels"
        id: paliers
        continue-on-error: true
        run: npm run -s load:paliers

      - name: Résumé dans la page du run
        if: always()
        run: |
          {
            echo "## Bilan de charge k6 — base : $([ "$USE_ATLAS" = true ] && echo Atlas || echo 'MongoDB jetable (CI)')"
            echo "Rapports HTML complets : section **Artifacts** en bas de cette page."
            for md in paliers breakpoint; do
              [ -f "load-tests/reports/$md.md" ] && cat "load-tests/reports/$md.md"
            done
            for f in k6-progressif.txt k6-max.txt; do
              [ -f "$f" ] || continue
              echo "### ${f%.txt}"
              echo '```'
              sed -n '/█ \(THRESHOLDS\|TOTAL RESULTS\)/,$p' "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrement des rapports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bilan-k6-${{ github.run_number }}
          path: |
            movies-api-loadtest/load-tests/reports/
            movies-api-loadtest/k6-*.txt
            movies-api-loadtest/server.log
          retention-days: 30
          if-no-files-found: warn

      - name: Verdict
        if: steps.progressif.outcome == 'failure' || steps.max.outcome == 'failure' || steps.rupture.outcome == 'failure' || steps.paliers.outcome == 'failure'
        run: |
          echo "::error::Au moins une simulation k6 a échoué (seuil dépassé ou erreur) : voir le résumé et les rapports."
          exit 1

  barometre:
    needs: bilan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: movies-api-loadtest/scripts/barometre.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Baromètre W/L
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
          CURRENT_CONCLUSION: ${{ needs.bilan.result }}
          CURRENT_TITLE: ${{ github.event.head_commit.message || github.event_name }}
        run: |
          WORKFLOW_FILE=$(basename "${WORKFLOW_FILE%@*}")
          node movies-api-loadtest/scripts/barometre.mjs | tee -a "$GITHUB_STEP_SUMMARY"

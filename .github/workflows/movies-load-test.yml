name: "movies-api-loadtest : tests de charge k6"

# CI rapide (~2 min 30) à chaque push touchant movies-api-loadtest/ : build, vérification des types,
# seuils anti-régression (débit maximal, 10 s par route) et paliers courts, sur une base MongoDB jetable.
# Le bilan complet (progressif, rupture, paliers longs) est dans movies-bilan-charge.yml.
on:
  push:
    paths:
      - "movies-api-loadtest/**"
      - ".github/workflows/movies-load-test.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même branche annule la vérification en cours.
concurrency:
  group: movies-load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    # Version figée : même machine d'un run à l'autre, donc résultats comparables.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: movies-api-loadtest

    env:
      MONGODB_URI: mongodb://localhost:27017

    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movies-api-loadtest/package-lock.json

      - run: npm ci

      - name: Vérification des types et build
        run: |
          npm run typecheck
          npm run build

      - name: Remplissage de la base jetable
        run: npm run seed

      - name: Démarrage de l'API
        run: |
          npm start > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      # continue-on-error : un seuil dépassé ne doit pas empêcher l'enregistrement des rapports.
      - name: Seuils anti-régression (débit maximal, 10 s par route)
        id: max
        continue-on-error: true
        run: npm run -s load:max -- --quiet -e SECONDS=10 2>&1 | tee k6-max.txt

      # Le premier palier en échec est le résultat attendu ; seule une erreur technique fait échouer l'étape.
      - name: Paliers courts (5 → 800 utilisateurs virtuels, 10 s chacun)
        id: paliers
        continue-on-error: true
        env:
          PALIERS: "5 50 200 400 800"
        run: npm run -s load:paliers -- -e DURATION=10s

      - name: Résumé dans la page du run
        if: always()
        run: |
          {
            echo "## Seuils anti-régression k6 — base MongoDB jetable (CI)"
            echo "Bilan complet (progressif, rupture, paliers longs) : workflow *bilan de charge complet*, lancement manuel ou chaque lundi."
            [ -f load-tests/reports/paliers.md ] && cat load-tests/reports/paliers.md
            echo "### Seuils anti-régression"
            if [ -f k6-max.txt ]; then
              echo '```'
              sed -n '/█ THRESHOLDS/,/█ TOTAL RESULTS/p' k6-max.txt | sed '$d'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrement des rapports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-k6-${{ github.run_number }}
          path: |
            movies-api-loadtest/load-tests/reports/
            movies-api-loadtest/k6-*.txt
            movies-api-loadtest/server.log
          retention-days: 14
          if-no-files-found: warn

      # Le job échoue si un seuil anti-régression casse ou si les paliers plantent, une fois les rapports enregistrés.
      - name: Verdict
        if: steps.max.outcome == 'failure' || steps.paliers.outcome == 'failure'
        run: |
          echo "::error::Régression de performance ou erreur technique pendant les tests (voir le résumé et les rapports)."
          exit 1

  # Baromètre W/L : historique des derniers runs, affiché dans le résumé (lecture seule de l'historique Actions).
  barometre:
    needs: load-test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: movies-api-loadtest/scripts/barometre.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Baromètre W/L
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: ${{ github.workflow_ref }}
          CURRENT_CONCLUSION: ${{ needs.load-test.result }}
          CURRENT_TITLE: ${{ github.event.head_commit.message || github.event_name }}
        run: |
          # github.workflow_ref = owner/repo/.github/workflows/<fichier>@ref : on garde le nom du fichier.
          WORKFLOW_FILE=$(basename "${WORKFLOW_FILE%@*}")
          node movies-api-loadtest/scripts/barometre.mjs | tee -a "$GITHUB_STEP_SUMMARY"

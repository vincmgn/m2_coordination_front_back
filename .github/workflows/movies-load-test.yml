name: "movies-api-loadtest : tests de charge k6"

# Ne se déclenche que si movies-api-loadtest/ (ou ce fichier) change.
# - À chaque push : simulation sur une base MongoDB jetable remplie de films factices (résultats comparables).
# - Bouton "Run workflow" (onglet Actions) : même simulation, au choix sur la base jetable ou sur Atlas
#   (secret MONGODB_URI requis + accès réseau Atlas ouvert à 0.0.0.0/0).
on:
  push:
    paths:
      - "movies-api-loadtest/**"
      - ".github/workflows/movies-load-test.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Base de données utilisée"
        type: choice
        options: [atlas, ci]
        default: atlas

permissions:
  contents: read

# Un nouveau push sur la même branche annule la simulation en cours.
concurrency:
  group: movies-load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    # Version figée : même machine d'un run à l'autre, donc résultats comparables.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: movies-api-loadtest

    env:
      USE_ATLAS: ${{ github.event_name == 'workflow_dispatch' && inputs.base == 'atlas' }}
      MONGODB_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.base == 'atlas' && secrets.MONGODB_URI || 'mongodb://localhost:27017' }}

    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movies-api-loadtest/package-lock.json

      - run: npm ci

      - name: Vérification des types et build
        run: |
          npm run typecheck
          npm run build

      - name: Vérification du secret Atlas
        if: env.USE_ATLAS == 'true'
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Secret MONGODB_URI absent (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Remplissage de la base jetable
        if: env.USE_ATLAS != 'true'
        run: npm run seed

      - name: Démarrage de l'API
        run: |
          npm start > server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      # continue-on-error : un seuil dépassé ne doit pas empêcher les tests suivants ni l'enregistrement des rapports.
      - name: "Simulation 1 : montée en charge progressive"
        id: progressif
        continue-on-error: true
        run: npm run -s load:report -- --quiet 2>&1 | tee k6-progressif.txt

      - name: "Simulation 2 : débit maximal par route (seuils anti-régression)"
        id: max
        continue-on-error: true
        run: npm run -s load:max -- --quiet 2>&1 | tee k6-max.txt

      # Ici, un seuil cassé est le résultat attendu (le point de rupture) : seule une vraie erreur fait échouer l'étape.
      - name: "Simulation 3 : test de rupture par route"
        id: rupture
        continue-on-error: true
        run: npm run -s load:breakpoint

      # Même logique : le premier palier en échec est le résultat ; seule une erreur technique fait échouer l'étape.
      - name: "Simulation 4 : paliers d'utilisateurs virtuels"
        id: paliers
        continue-on-error: true
        run: npm run -s load:paliers

      - name: Résumé dans la page du run
        if: always()
        run: |
          {
            echo "## Tests de charge k6 — base : $([ "$USE_ATLAS" = true ] && echo Atlas || echo 'MongoDB jetable (CI)')"
            echo "Rapports HTML complets : section **Artifacts** en bas de cette page."
            for md in paliers breakpoint; do
              [ -f "load-tests/reports/$md.md" ] && cat "load-tests/reports/$md.md"
            done
            for f in k6-progressif.txt k6-max.txt; do
              [ -f "$f" ] || continue
              echo "### ${f%.txt}"
              echo '```'
              # Commence à THRESHOLDS s'il y a des seuils, sinon à TOTAL RESULTS (cas de load:max).
              sed -n '/█ \(THRESHOLDS\|TOTAL RESULTS\)/,$p' "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrement des rapports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-k6-${{ github.run_number }}
          path: |
            movies-api-loadtest/load-tests/reports/
            movies-api-loadtest/k6-*.txt
            movies-api-loadtest/server.log
          retention-days: 30
          if-no-files-found: warn

      # Le job échoue si un seuil des simulations 1 et 2 casse (régression) ou si les simulations 3 et 4 plantent,
      # une fois les rapports enregistrés.
      - name: Verdict
        if: steps.progressif.outcome == 'failure' || steps.max.outcome == 'failure' || steps.rupture.outcome == 'failure' || steps.paliers.outcome == 'failure'
        run: |
          echo "::error::Au moins une simulation k6 a échoué (seuil dépassé ou erreur) : voir le résumé et les rapports."
          exit 1

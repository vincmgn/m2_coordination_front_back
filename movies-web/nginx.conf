# Même rôle que le proxy Vite en dev : le front appelle /api/*, nginx transmet à l'API sans le préfixe.

# Journal d'accès SANS chaîne de requête (TP Géolocalisation) : $uri est le chemin seul, alors que $request,
# $request_uri et $args contiendraient ?lat=…&lon=… (position du spectateur) ou ?q=… (saisie de recherche).
# Vérifié par tests/geoloc-privacy.test.ts de l'API.
log_format sans_position '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

# --- Sécurité ------------------------------------------------------------------------------------
# En-têtes des pages (location / et /assets/) : CSP stricte, sans script ni style inline. Domaines externes :
# polices Google (style et police), images https (affiches, tuiles OpenStreetMap), géocodage IGN (data.geopf.fr).
# Les réponses de /api/ portent les en-têtes de l'API elle-même (CSP « rien », cf. src/security.ts).
# Limites de fréquence par IP (défense en profondeur : l'API a aussi les siennes, par compte et par e-mail).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=otlp:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;            # pas de version de nginx dans les réponses ni les pages d'erreur
  client_max_body_size 32k;     # le plus gros corps légitime est une réservation (quelques centaines d'octets)
  client_body_timeout 10s;      # connexions lentes (Slowloris)
  client_header_timeout 10s;
  limit_conn conn 50;           # connexions simultanées par IP (flux SSE compris)
  # Remplace, pour ce serveur, le format « main » de l'image nginx (qui journalise $request).
  access_log /var/log/nginx/access.log sans_position;

  # Connexion et inscription : 10 par minute et par IP (force brute, création de comptes en masse).
  location /api/auth/ {
    access_log /var/log/nginx/access.log sans_position; # pas de $args
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api:3000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # IP du client : écrasée (et non complétée) pour qu'un client ne puisse pas en glisser une fausse.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;   # hôte:port vu par le navigateur (contrôle Origin de l'API)
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    access_log /var/log/nginx/access.log sans_position; # pas de $args
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api:3000/;  # « api » = nom du service dans docker-compose.yml
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # IP du client : écrasée (et non complétée) pour qu'un client ne puisse pas en glisser une fausse.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;   # hôte:port vu par le navigateur (contrôle Origin de l'API)
    proxy_set_header X-Forwarded-Proto $scheme;
    # Flux SSE (/screenings/:id/events) : pas de mise en mémoire tampon, connexion longue.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Traces du navigateur : relayées au collecteur, sur la même origine que la page (pas de CORS).
  # La barre finale retire le préfixe : /otlp/v1/traces → http://collector:4318/v1/traces.
  location /otlp/ {
    limit_req zone=otlp burst=20 nodelay;
    limit_except POST { deny all; }   # le navigateur ne fait qu'envoyer des spans
    proxy_pass http://collector:4318/;
    client_max_body_size 256k;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fichiers cachés (.git, .env…) : jamais servis.
  location ~ /\. {
    deny all;
  }

  # Routes Vue Router (mode history) : toute URL inconnue renvoie index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://data.geopf.fr; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # index.html toujours revalidé (nouvelle version prise tout de suite) ; les fichiers /assets/ ont un hachage dans leur nom.
    add_header Cache-Control "no-cache" always;
  }

  location /assets/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://data.geopf.fr; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}

# Même rôle que le proxy Vite en dev : le front appelle /api/*, nginx transmet à l'API sans le préfixe.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000/;  # « api » = nom du service dans docker-compose.yml
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Flux SSE (/screenings/:id/events) : pas de mise en mémoire tampon, connexion longue.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Routes Vue Router (mode history) : toute URL inconnue renvoie index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
